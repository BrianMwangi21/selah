[project]
name = "selah"
version = "0.1.0"
description = "Selah — AI gospel song pipeline: vibe + theme -> lyrics -> music."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
    "pydantic>=2.0",
]

[project.scripts]
selah = "selah.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selah"]
